<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Form Assistant – Listening</title>
    <style>
      body{font-family:system-ui,Segoe UI,Arial,sans-serif;margin:0;padding:16px;background:#fff;color:#222}
      h1{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
      .dot{width:10px;height:10px;border-radius:50%;background:#bbb}
      .dot.on{background:#e53935;animation:p 1s infinite}
      @keyframes p{50%{opacity:.3}}
      #status{font-size:13px;color:#555;margin-bottom:8px}
      #text{min-height:70px;max-height:130px;overflow:auto;border:1px solid #ddd;border-radius:8px;padding:8px;font-size:14px;background:#fafafa}
      #interim{color:#999}
      #err{color:#c62828;font-size:13px;margin:8px 0}
      button{margin-top:10px;padding:8px 16px;border:0;border-radius:8px;background:#e53935;color:#fff;font-size:14px;cursor:pointer}
      p.hint{font-size:12px;color:#777;margin:8px 0 0}
    </style>
  </head>
  <body>
    <h1><span class="dot" id="dot"></span> Voice Form Assistant</h1>
    <div id="status">Starting microphone…</div>
    <div id="text"><span id="final"></span><span id="interim"></span></div>
    <div id="err"></div>
    <button id="stop">Stop &amp; close</button>
    <p class="hint">Keep this small window open while you speak. Switch back to your form tab and open the extension to continue.</p>
    <script type="module" src="/src/listen/listen.ts"></script>
  </body>
</html>
